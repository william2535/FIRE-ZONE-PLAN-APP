const frame=document.getElementById('appFrame');

function applyCompanyBrand(){
  try{
    const d=frame.contentDocument;
    if(!d) return;
    if(d.getElementById('companyDemo247Style')) return;
    const style=d.createElement('style');
    style.id='companyDemo247Style';
    style.textContent=`
      .brand{display:flex!important;align-items:center!important;justify-content:flex-start!important;min-width:104px!important;max-width:118px!important;height:60px!important;padding:2px 0!important;overflow:visible!important}
      .brand>*{display:none!important}
      .brand .company247Logo{display:block!important;width:104px!important;height:58px!important;object-fit:contain!important;object-position:left center!important;border-radius:7px!important;background:#fff!important;box-shadow:0 4px 14px #06182a26!important}
      .homeProductHero{position:relative!important}
      .company247HomeBadge{display:flex;align-items:center;gap:12px;margin:0 0 18px;padding:11px 13px;border:1px solid #d8e3ec;border-radius:16px;background:#fff;box-shadow:0 10px 30px #10263d12;max-width:310px}

      .company247HomeBadge div{min-width:0}
      .company247HomeBadge strong{display:block;color:#12395d;font-size:13px;letter-spacing:.02em}
      .company247HomeBadge span{display:block;margin-top:3px;color:#718399;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
      @media(max-width:720px){
        .brand{min-width:88px!important;max-width:96px!important;height:54px!important}
        .brand .company247Logo{width:90px!important;height:52px!important}
        .company247HomeBadge{max-width:260px;padding:9px 11px}
        .company247HomeBadge img{width:64px;height:63px}
      }
    `;
    d.head.appendChild(style);

    const brand=d.querySelector('.brand');
    if(brand){
      brand.innerHTML='';
      const img=d.createElement('img');
      img.className='company247Logo';
      img.src=LOGO;
      img.alt='24/7 Protection';
      brand.appendChild(img);
    }

    const hero=d.querySelector('.homeProductHero');
    if(hero && !d.getElementById('company247HomeBadge')){
      const badge=d.createElement('div');
      badge.id='company247HomeBadge';
      badge.className='company247HomeBadge';
      badge.innerHTML=`<img src="${LOGO}" alt="24/7 Protection"><div><strong>24/7 Protection</strong><span>Company branded test build</span></div>`;
      hero.prepend(badge);
    }

    const eyebrow=d.querySelector('.homeEyebrow');
    if(eyebrow) eyebrow.textContent='24/7 PROTECTION · FIRE & SECURITY FIELD WORKSPACE · DEMO';

    const observer=new MutationObserver(()=>{
      const b=d.querySelector('.brand');
      if(b && !b.querySelector('.company247Logo')){
        b.innerHTML='';
        const i=d.createElement('img'); i.className='company247Logo'; i.src=LOGO; i.alt='24/7 Protection'; b.appendChild(i);
      }
      const h=d.querySelector('.homeProductHero');
      if(h && !d.getElementById('company247HomeBadge')){
        const badge=d.createElement('div');
        badge.id='company247HomeBadge';
        badge.className='company247HomeBadge';
        badge.innerHTML=`<img src="${LOGO}" alt="24/7 Protection"><div><strong>24/7 Protection</strong><span>Company branded test build</span></div>`;
        h.prepend(badge);
      }
    });
    observer.observe(d.body,{childList:true,subtree:true});
  }catch(e){ console.warn('Company demo branding could not be applied',e); }
}
frame.addEventListener('load',()=>{applyCompanyBrand();setTimeout(applyCompanyBrand,250);setTimeout(applyCompanyBrand,1000);});
</script>
