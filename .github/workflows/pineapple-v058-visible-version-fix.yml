name: Pineapple v0.58 visible version fix
on:
  push:
    branches: [project-pineapple-v058]
    paths: [.github/workflows/pineapple-v058-visible-version-fix.yml]
permissions:
  contents: write
jobs:
  fix-visible-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-pineapple-v058
      - name: Replace only visible web version labels
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('index.html'), Path('ZoneSketch.html'), Path('Zone-Sketch-by-Will.html'), Path('app/src/main/assets/index.html')]
          replacements = {
              'class="homeVersion">ZONE SKETCH · v0.57<': 'class="homeVersion">ZONE SKETCH · v0.58<',
              'BY WILL FLOOD · PLAN / ZONE MAKER · BETA v0.57': 'BY WILL FLOOD · PLAN / ZONE MAKER · BETA v0.58',
              'ZONE SKETCH · <b>v0.57</b> · DESIGNED': 'ZONE SKETCH · <b>v0.58</b> · DESIGNED',
          }
          for path in files:
              text = path.read_text()
              for old, new in replacements.items():
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one visible {old!r}, found {count}')
                  text = text.replace(old, new)
              path.write_text(text)
          for path in files[1:]:
              if path.read_bytes() != files[0].read_bytes():
                  raise SystemExit(f'{path}: generated copy diverged from index.html')
          print('Updated 3 visible v0.57 labels to v0.58 in all 4 app copies; historical engine comments left unchanged.')
          PY
      - name: Commit visible label correction
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html
          git diff --cached --check
          git commit -m "Correct visible web version labels to v0.58"
          git push origin HEAD:project-pineapple-v058
