name: Release On Site Zone Planner v0.25

on:
  push:
    paths:
      - '.github/upgrade_v025.py'
      - '.github/workflows/release-v025.yml'
      - 'tests/note-size.cjs'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.25 resizable notes upgrade
        run: python .github/upgrade_v025.py

      - name: Verify v0.25 source and note sizing
        shell: bash
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          grep -q "versionCode 25" app/build.gradle
          grep -q "versionName '0.25'" app/build.gradle
          grep -q "\['labels','symbols','notes','pins'\].includes(ref.type)" index.html
          grep -q "\['labels','symbols','notes','pins'\].includes(snap.ref.type)" index.html
          grep -q "badge(ctx,p.x,p.y,n.text,'#1b344e',n.scale||1)" index.html
          grep -q "stampSize\*.72\*(pin.scale||1)" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/zonesketch-v025.js').write_text('\n'.join(scripts))
          ids=re.findall(r'\bid="([^"]+)"',t)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          print('v0.25 static checks passed')
          PY
          node --check /tmp/zonesketch-v025.js

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run full browser regression suite
        run: |
          node tests/note-size.cjs
          node tests/favourites.cjs
          node tests/survey-mode.cjs
          node tests/projects.cjs
          node tests/browser.cjs
          node tests/floors.cjs
          node tests/interactions.cjs
          if [ -f tests/v020.cjs ]; then node tests/v020.cjs; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build v0.25 Android APK
        run: gradle --no-daemon assembleDebug

      - name: Update public v0.25 download
        shell: bash
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Zone-Sketch-by-Will-v0.25.apk
          python - <<'PY'
          from pathlib import Path
          p=Path('download.html')
          t=p.read_text().replace('v0.24','v0.25').replace('Zone-Sketch-by-Will-v0.24.apk','Zone-Sketch-by-Will-v0.25.apk')
          p.write_text(t)
          PY

      - name: Commit v0.25 source and public APK
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html app/build.gradle README.md download.html downloads/Zone-Sketch-by-Will-v0.25.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Release On Site Zone Planner v0.25 resizable notes'
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.25-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.25-Test-Previews
          path: test-results/
          if-no-files-found: warn
