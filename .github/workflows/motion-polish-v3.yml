name: Sleek motion browser check

on:
  push:
    paths:
      - '.github/workflows/motion-polish-v3.yml'

permissions:
  contents: read

jobs:
  browser-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install browser tooling
        run: |
          npm install --no-save playwright@1.62.1 acorn
          npx playwright install --with-deps chromium webkit
      - name: Verify app and protected build
        run: |
          python .github/verify_247_protected.py
          node tests/release-v062.cjs
          node tests/circuit-editor-syntax-v058.cjs
          node tests/projects.cjs
      - name: Review Chromium layouts and motion
        run: node tests/brand-pages.cjs
      - name: Review WebKit layouts and motion
        env:
          PINEAPPLE_BROWSER: webkit
        run: node tests/brand-pages.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion-polish-previews
          path: test-results/brand-*.png
