name: Sleek motion polish v3

on:
  push:
    paths:
      - '.github/workflows/motion-polish-v3.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add professional ambient motion
        run: python .github/motion_polish_v3.py
      - name: Sanity check motion markers
        run: |
          grep -q 'Motion polish v3' index.html
          grep -q 'Motion polish v3' beta.html
          grep -q 'zsMotionActive' index.html
          grep -q 'zsMotionActive' beta.html
      - name: Commit polished motion
        run: |
          if git diff --quiet -- index.html beta.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html beta.html
          git commit -m 'Polish Zone Sketch ambient motion'
          git push origin HEAD:main
