name: Sync v0.62 motion mirrors

on:
  push:
    paths:
      - '.github/workflows/motion-polish-v3.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep app mirrors byte-identical
        run: |
          cp index.html ZoneSketch.html
          cp index.html Zone-Sketch-by-Will.html
          cp index.html app/src/main/assets/index.html
          cp beta.html download.html
      - name: Verify mirrors
        run: |
          cmp --silent index.html ZoneSketch.html
          cmp --silent index.html Zone-Sketch-by-Will.html
          cmp --silent index.html app/src/main/assets/index.html
          cmp --silent beta.html download.html
      - name: Commit mirror sync
        run: |
          if git diff --quiet -- ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html download.html; then
            echo 'Mirrors already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html download.html
          git commit -m 'Sync v0.62 mirrors with motion polish'
          git push origin HEAD:main
