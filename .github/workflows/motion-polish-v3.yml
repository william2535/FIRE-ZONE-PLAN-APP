name: Sync ZoneSketch mirror

on:
  push:
    paths:
      - '.github/workflows/motion-polish-v3.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Keep release mirror byte-identical
        run: cp index.html ZoneSketch.html
      - name: Verify mirror
        run: cmp --silent index.html ZoneSketch.html
      - name: Commit mirror sync
        run: |
          if git diff --quiet -- ZoneSketch.html; then
            echo 'Mirror already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ZoneSketch.html
          git commit -m 'Sync ZoneSketch mirror with motion polish'
          git push origin HEAD:main
