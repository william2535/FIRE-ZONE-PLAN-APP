name: Deepen Survey placement thock

on:
  push:
    branches: [project-pineapple-deep-survey-thock]
    paths:
      - '.github/workflows/deepen-survey-thock.yml'
      - '.github/deepen_survey_placement_sound.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-pineapple-deep-survey-thock

      - name: Install deep mechanical Survey thock
        run: python .github/deepen_survey_placement_sound.py

      - name: Sync web mirrors and Android asset
        run: |
          cp index.html ZoneSketch.html
          cp index.html Zone-Sketch-by-Will.html
          cp index.html app/src/main/assets/index.html

      - name: Install syntax dependency
        run: npm install --no-save acorn

      - name: Verify deeper thock and release safety
        run: |
          python .github/verify_247_protected.py
          node tests/release-v062.cjs
          node tests/circuit-editor-syntax-v058.cjs
          grep -q 'Deep mechanical-keyboard style THOCK' index.html
          grep -q "surveyPlacementSound(symbolStamp)" index.html
          grep -q "surveyPlacementSound('beam')" index.html
          grep -q 'iPadOS standalone viewport fill' index.html
          test "$(git hash-object beta.html)" = "0cda84d2c0907160c63366922330c43586f7b191"
          cmp --silent index.html ZoneSketch.html
          cmp --silent index.html Zone-Sketch-by-Will.html
          cmp --silent index.html app/src/main/assets/index.html

      - name: Commit tested deeper Survey thock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html
          git rm .github/deepen_survey_placement_sound.py .github/workflows/deepen-survey-thock.yml
          git commit -m 'Make Survey placement sound deeper and heavier'
          git push origin HEAD:project-pineapple-deep-survey-thock
