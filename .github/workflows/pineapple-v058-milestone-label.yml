name: Pineapple v0.58 milestone label
on:
  push:
    branches: [project-pineapple-v058]
    paths:
      - '.github/pineapple_v058_milestone_label.py'
      - '.github/workflows/pineapple-v058-milestone-label.yml'
permissions:
  contents: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-pineapple-v058
          fetch-depth: 0
      - name: Apply v0.58 milestone label
        run: python .github/pineapple_v058_milestone_label.py
      - name: Verify protected 24/7 build
        run: python .github/verify_247_protected.py
      - name: Parse inline JavaScript
        run: |
          npm install --no-save acorn@8.15.0
          node tests/circuit-editor-syntax-v058.cjs
      - name: Verify generated app copies
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          git diff --check
      - name: Commit milestone label
        run: |
          if git diff --quiet; then
            echo 'No milestone label changes to commit.'
            exit 0
          fi
          git config user.name 'william2535'
          git config user.email '48844093+william2535@users.noreply.github.com'
          git add index.html Zone-Sketch-by-Will.html ZoneSketch.html app/src/main/assets/index.html
          git commit -m 'Label Pineapple web milestone v0.58'
          git push origin HEAD:project-pineapple-v058
