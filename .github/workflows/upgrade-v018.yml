name: Upgrade Zone Sketch v0.18

on:
  push:
    paths:
      - '.github/upgrade_v018.py'
      - '.github/workflows/upgrade-v018.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.18 upgrade
        run: python .github/upgrade_v018.py

      - name: Check JavaScript, synced copies and symbol rotation
        shell: bash
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html app/src/main/assets/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          markers=[
            "function drawSymbol(c,p,type,size,color='#172333',rotation=0)",
            "c.rotate((Number(rotation)||0)*Math.PI/180)",
            "o.rotation=((Number(o.rotation)||0)+90)%360",
            "sm.rotation||0",
            "'shapes','symbols'].includes(ref.type)"
          ]
          for m in markers:
            assert m in t, m
          assert t.count("sm.rotation||0") >= 2, 'screen + export rotation calls required'
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts))
          print('v0.18 symbol-rotation markers and synced copies verified')
          PY
          node --check /tmp/app.js

      - name: Add README v0.18 note
        shell: bash
        run: |
          if ! grep -q 'Version 0.18' README.md; then
            cat >> README.md <<'EOF'

          ## Version 0.18
          - Rotating a room/group now rotates symbol orientation as well as symbol position.
          - Symbol rotation is saved per symbol and preserved in office exports.
          - Single symbols can be rotated from Object Properties.
          - Existing drafts remain compatible; symbols without a saved angle default to 0 degrees.
          EOF
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android APK
        run: gradle assembleDebug --no-daemon

      - name: Commit upgraded source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html app/src/main/assets/index.html README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Zone Sketch v0.18 symbol rotation'
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ZoneSketch-v0.18-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
