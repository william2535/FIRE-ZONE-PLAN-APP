name: Release On Site Zone Planner v0.46
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v046.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.46 Circuit Builder reward changes
        run: |
          python .github/fix_v046_circuit_rewards.py
          python .github/fix_v046_reward_css.py
      - name: Verify v0.46 source
        shell: bash
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          grep -q "versionCode 47" app/build.gradle
          grep -q "versionName '0.46'" app/build.gradle
          grep -q 'cbCelebrateRetry' index.html
          grep -q 'cbAutoCompleteCircuit' index.html
          grep -q 'cbBoardWrap.cbWon' index.html
          grep -q 'celebration child style isolation' index.html
          grep -q 'v0.46' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/zonesketch-v046.js').write_text('\n'.join(scripts))
          assert "if(ready){cbCommitDrag();cbAutoCompleteCircuit();return true}" in t
          assert "$('cbCelebrateUndo').onclick=cbUndo" in t
          assert "$('cbCelebrateRetry').onclick=cbRetryCompleteCircuit" in t
          assert "setTimeout(()=>{$('cbCelebrate').hidden=true},900)" not in t
          print('v0.46 static checks passed')
          PY
          node --check /tmp/zonesketch-v046.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run Circuit Builder and touch regressions
        run: |
          node tests/circuit-builder-v043.cjs
          node tests/circuit-builder-v046.cjs
          node tests/canvas-touch-v042.cjs
          node tests/survey-edit-zoom.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build v0.46 Android APK
        run: gradle --no-daemon assembleDebug
      - name: Update public v0.46 download
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Zone-Sketch-by-Will-v0.46.apk
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('download.html')
          t=p.read_text()
          t=re.sub(r'v0\.\d+(?:\.\d+)?', 'v0.46', t)
          t=re.sub(r'downloads/Zone-Sketch-by-Will-v[0-9.]+\.apk', 'downloads/Zone-Sketch-by-Will-v0.46.apk', t)
          p.write_text(t)
          PY
      - name: Commit v0.46 source and public APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html app/build.gradle download.html downloads/Zone-Sketch-by-Will-v0.46.apk
          git commit -m 'Release On Site Zone Planner v0.46 Circuit Builder rewards' || exit 0
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/zone-sketch-v046.apk
          git stash push --include-untracked -m 'v0.46 runner build state' || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          mkdir -p app/build/outputs/apk/debug
          cp /tmp/zone-sketch-v046.apk app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.46-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
