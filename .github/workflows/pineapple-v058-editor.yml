name: Pineapple v0.58 manual editor
on:
  push:
    branches: [project-pineapple-v058]
permissions:
  contents: read
jobs:
  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected 24/7 build
        run: python .github/verify_247_protected.py
      - name: Parse inline JavaScript before browser startup
        run: |
          npm install --no-save acorn@8.15.0
          node tests/circuit-editor-syntax-v058.cjs
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify editor build starts cleanly
        run: node tests/circuit-editor-startup-v058.cjs
      - name: Run draft-first manual editor behaviour
        run: node tests/circuit-manual-editor-v058.cjs
      - name: Re-run Smart Route compatibility
        run: |
          node tests/circuit-capture-transition-v058.cjs
          node tests/circuit-routing-state-v057.cjs
          node tests/circuit-aggressive-touch-v057.cjs
          node tests/circuit-routing-hardening-v057.cjs
          node tests/circuit-return-magnet-v056.cjs
      - name: Validate generated app copies
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          git diff --check
