name: Add survey placement ASMR sound

on:
  push:
    branches: [project-pineapple-survey-asmr]
    paths:
      - '.github/workflows/survey-device-asmr.yml'
      - '.github/survey_device_asmr.py'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-pineapple-survey-asmr

      - name: Install survey placement ASMR sound
        run: python .github/survey_device_asmr.py

      - name: Sync web mirrors and Android asset
        run: |
          cp index.html ZoneSketch.html
          cp index.html Zone-Sketch-by-Will.html
          cp index.html app/src/main/assets/index.html

      - name: Install syntax dependency
        run: npm install --no-save acorn

      - name: Verify sound hooks and release safety
        run: |
          python .github/verify_247_protected.py
          node tests/release-v062.cjs
          node tests/circuit-editor-syntax-v058.cjs
          grep -q "function surveyPlacementSound(type='smoke')" index.html
          grep -q "surveyPlacementSound(symbolStamp)" index.html
          grep -q "surveyPlacementSound('beam')" index.html
          grep -q 'Survey placement ASMR + Circuit Builder chimes' index.html
          grep -q 'iPadOS standalone viewport fill' index.html
          test "$(git hash-object beta.html)" = "0cda84d2c0907160c63366922330c43586f7b191"
          cmp --silent index.html ZoneSketch.html
          cmp --silent index.html Zone-Sketch-by-Will.html
          cmp --silent index.html app/src/main/assets/index.html

      - name: Commit tested survey sound
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html
          git rm .github/survey_device_asmr.py .github/workflows/survey-device-asmr.yml
          git commit -m 'Add tactile survey device placement sound'
          git push origin HEAD:project-pineapple-survey-asmr
