name: Release Zone Sketch v0.51 Grid Routing
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v051.yml'
      - '.github/fix_v051_circuit_grid.py'
      - 'tests/circuit-grid-routing-v051.cjs'
      - 'tests/run-regressions.cjs'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protect separate company demo
        run: |
          if [ -f company-demos/247-protection/index.html ]; then sha256sum company-demos/247-protection/index.html > /tmp/company-demo.sha; fi
      - name: Apply v0.51 clean grid routing
        run: |
          if grep -q "versionName '0.51'" app/build.gradle; then
            echo 'v0.51 already applied'
          else
            python -m py_compile .github/fix_v051_circuit_grid.py
            python .github/fix_v051_circuit_grid.py
          fi
      - name: Prove company demo stayed separate
        run: |
          if [ -f /tmp/company-demo.sha ]; then sha256sum -c /tmp/company-demo.sha; fi
          git diff --exit-code -- company-demos/247-protection 247-protection-demo.html
      - name: Verify v0.51 source
        shell: bash
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          grep -q "versionCode 52" app/build.gradle
          grep -q "versionName '0.51'" app/build.gradle
          grep -q 'v0.51 circuit grid routing' index.html
          grep -q 'CB_ROUTE_GRID=24' index.html
          grep -q 'CB_ROUTE_TURN_CELLS=1.45' index.html
          grep -q 'function cbRouteGridStep' index.html
          grep -q 'function cbDrawRouteGrid' index.html
          grep -q 'cable snaps to grid' index.html
          grep -q "indexedDB.open('ZoneSketch-v1',1)" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/zonesketch-v051.js').write_text('\n'.join(scripts))
          assert 'v0.51' in t
          assert 'CB_ROUTE_GRID=24' in t
          assert 'CB_ROUTE_TURN_CELLS=1.45' in t
          print('v0.51 static checks passed')
          PY
          node --check /tmp/zonesketch-v051.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run full regressions
        run: node tests/run-regressions.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build v0.51 Android APK
        run: gradle --no-daemon assembleDebug
      - name: Update public v0.51 APK
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Zone-Sketch-by-Will-v0.51.apk
      - name: Commit v0.51 main build only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html app/build.gradle beta.html download.html downloads/Zone-Sketch-by-Will-v0.51.apk
          git commit -m 'Release Zone Sketch v0.51 clean grid-snapped Circuit Builder routing' || true
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Zone-Sketch-by-Will-v0.51.apk
          git stash push --include-untracked -m 'v0.51 runner build state' || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          mkdir -p app/build/outputs/apk/debug
          cp /tmp/Zone-Sketch-by-Will-v0.51.apk app/build/outputs/apk/debug/app-debug.apk
      - name: Publish v0.51 Android APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.51 >/dev/null 2>&1 || gh release create v0.51 --title 'Zone Sketch v0.51' --notes 'Circuit Builder routes now follow a clean visible grid with turn hysteresis to remove accidental extra bends.'
          gh release upload v0.51 /tmp/Zone-Sketch-by-Will-v0.51.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: Zone-Sketch-v0.51-Grid-Routing-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
