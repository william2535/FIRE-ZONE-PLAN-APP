name: Apply visual-only workspace UI shell

on:
  push:
    branches: [main]
    paths:
      - '.github/workspace_ui_shell.py'
      - '.github/workflows/workspace-ui-shell.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply visual-only Plan Survey Circuit shell
        run: python .github/workspace_ui_shell.py

      - name: Sync app mirrors and Android asset
        run: |
          cp index.html ZoneSketch.html
          cp index.html Zone-Sketch-by-Will.html
          cp index.html app/src/main/assets/index.html

      - name: Install syntax dependency
        run: npm install --no-save acorn

      - name: Verify visual-only shell and release safety
        run: |
          python .github/verify_247_protected.py
          node tests/release-v062.cjs
          node tests/circuit-editor-syntax-v058.cjs
          grep -q 'Workspace UI shell v1 — visual-only polish' index.html
          grep -q 'End workspace UI shell v1' index.html
          grep -q 'iOS/iPadOS standalone viewport fill' index.html
          grep -q '@supports (height:100dvh)' index.html
          grep -q 'App motion parity — tester-hub movement mapped onto the real app shell' index.html
          test "$(git hash-object beta.html)" = "0cda84d2c0907160c63366922330c43586f7b191"
          cmp --silent index.html ZoneSketch.html
          cmp --silent index.html Zone-Sketch-by-Will.html
          cmp --silent index.html app/src/main/assets/index.html

      - name: Commit visual-only shell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'Workspace UI shell already current.'
          else
            git commit -m 'Polish Plan Survey and Circuit workspace UI'
            git push origin HEAD:main
          fi
