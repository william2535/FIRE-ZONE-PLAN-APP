name: Pineapple v0.58 capture transition
on:
  push:
    branches: [project-pineapple-v058]
permissions:
  contents: read
jobs:
  capture-transition:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Reproduce detector-capture rubber-band regression
        run: node tests/circuit-capture-transition-v058.cjs
