name: Fix iPhone top menu close control

on:
  push:
    branches: [main]
    paths:
      - '.github/iphone_top_menu_hotfix.py'
      - 'tests/iphone-top-menu-v062.cjs'
      - '.github/workflows/iphone-top-menu-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply iPhone header hotfix
        run: python .github/iphone_top_menu_hotfix.py

      - name: Verify protected 24/7 build
        run: python .github/verify_247_protected.py

      - name: Install browser runtimes
        run: |
          npm install --no-save playwright@1.62.1 acorn@8.15.0
          npx playwright install --with-deps chromium webkit

      - name: Test phone menu in Chromium
        run: |
          mkdir -p test-results
          set -o pipefail
          node tests/iphone-top-menu-v062.cjs 2>&1 | tee test-results/iphone-top-menu-chromium.log

      - name: Test phone menu in WebKit
        env:
          PINEAPPLE_BROWSER: webkit
        run: |
          mkdir -p test-results
          set -o pipefail
          node tests/iphone-top-menu-v062.cjs 2>&1 | tee test-results/iphone-top-menu-webkit.log

      - name: Re-run release and syntax safety checks
        run: |
          node tests/release-v062.cjs
          node tests/circuit-editor-syntax-v058.cjs
          cmp --silent index.html ZoneSketch.html
          cmp --silent index.html Zone-Sketch-by-Will.html
          cmp --silent index.html app/src/main/assets/index.html
          git diff --check

      - name: Commit tested iPhone menu hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'iPhone menu hotfix already current.'
          else
            git commit -m 'Fix iPhone top menu close control'
            git push origin HEAD:main
          fi

      - name: Upload iPhone menu diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-top-menu-diagnostics
          path: test-results/
          if-no-files-found: ignore
