name: Finalize Zone Sketch v0.57 Smart Routing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-v057-routing.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Protect company demo
        run: python .github/verify_247_protected.py
      - name: Apply routing generation
        run: |
          python .github/apply_v057_routing.py
          for f in index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html; do
            sed -i 's#// v0.57 addressable return magnet#// v0.56 addressable return magnet#' "$f"
          done
      - name: Verify generated source
        run: |
          set -euo pipefail
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          grep -q "versionCode 58" app/build.gradle
          grep -q "versionName '0.57'" app/build.gradle
          grep -Fq 'CB_ROUTING_STATES' index.html
          grep -Fq 'function cbProfessionalizeLegPx' index.html
          grep -Fq 'function cbDeviceCorridorPx' index.html
          grep -Fq 'function cbGeometryIntent' index.html
          grep -Fq 'cbRouteStateBadge' index.html
          grep -Fq "'circuit-aggressive-touch-v057'" tests/run-regressions.cjs
          python .github/verify_247_protected.py
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/zonesketch-v057.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/zonesketch-v057.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Compare aggressive touch against v0.56 baseline
        env:
          ROUTING_PHASE: after
          ROUTING_OUTPUT: test-results/aggressive-touch-after.json
        run: node tests/circuit-aggressive-touch-v057.cjs
      - name: Run complete regression suite
        env:
          ROUTING_PHASE: after
          ROUTING_OUTPUT: test-results/aggressive-touch-suite.json
        run: node tests/run-regressions.cjs
      - name: Upload route-quality evidence
        uses: actions/upload-artifact@v4
        with:
          name: v0.57-aggressive-touch-after
          path: test-results/aggressive-touch-after.json
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build Android v0.57
        run: gradle --no-daemon assembleDebug
      - name: Prepare APK mirror
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/Zone-Sketch-by-Will-v0.57.apk
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Zone-Sketch-by-Will-v0.57.apk
      - name: Verify protected demo stayed untouched
        run: |
          python .github/verify_247_protected.py
          git diff --exit-code -- company-demos/247-protection 247-protection-demo.html
      - name: Commit validated v0.57 generation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html app/build.gradle tests/circuit-aggressive-touch-v057.cjs tests/run-regressions.cjs beta.html download.html downloads/Zone-Sketch-by-Will-v0.57.apk
          git commit -m 'Ship v0.57 Smart Route aggressive-touch overhaul'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Publish v0.57 tester APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.57 >/dev/null 2>&1 || gh release create v0.57 --title 'Zone Sketch v0.57'
          gh release edit v0.57 --notes 'Circuit Builder Smart Route overhaul: raw pointer input, swept device-hit detection and saved cable geometry are now separate. Deterministic clean, rough and abusive traces run across small/large iPhone, Android, small tablet and landscape viewports; completed legs are professionalized into clean orthogonal geometry when safe, corner state is explicit, start/device acquisition is more forgiving, and the v0.56 magnetic addressable return is preserved.'
          gh release upload v0.57 /tmp/Zone-Sketch-by-Will-v0.57.apk --clobber
