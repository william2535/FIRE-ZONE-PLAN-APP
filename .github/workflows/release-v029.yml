name: Release On Site Zone Planner v0.29

on:
  push:
    paths:
      - '.github/upgrade_v029.py'
      - '.github/workflows/release-v029.yml'
      - 'tests/zones-panel-v029.cjs'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.29 zones panel visibility hotfix
        run: python .github/upgrade_v029.py

      - name: Prepare legacy browser tests for bundled app assets
        run: python .github/prepare_static_test_servers.py

      - name: Verify v0.29 source and zones panel layout
        shell: bash
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          grep -q "versionCode 29" app/build.gradle
          grep -q "versionName '0.29'" app/build.gradle
          grep -q 'v0.29 — keep zone cards fully visible' index.html
          grep -q '#zoneSide{display:flex;flex-direction:column' index.html
          grep -q 'min-height:58px;overflow-y:auto' index.html
          grep -q '#zoneSide{height:118px;min-height:118px' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/zonesketch-v029.js').write_text('\n'.join(scripts))
          ids=re.findall(r'\bid="([^"]+)"',t)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          assert 'v0.28 — lock the app viewport' in t, 'v0.28 viewport lock must remain present'
          assert 'v0.29 — keep zone cards fully visible' in t
          print('v0.29 static zones-panel checks passed')
          PY
          node --check /tmp/zonesketch-v029.js

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run full browser regression suite
        run: |
          node tests/zones-panel-v029.cjs
          node tests/web-lock-v028.cjs
          node tests/plan-tools-v027.cjs
          node tests/drawing-tools-v026.cjs
          node tests/note-size.cjs
          node tests/favourites.cjs
          node tests/survey-mode.cjs
          node tests/projects.cjs
          node tests/browser.cjs
          node tests/floors.cjs
          node tests/interactions.cjs
          if [ -f tests/v020.cjs ]; then node tests/v020.cjs; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build v0.29 Android APK
        run: gradle --no-daemon assembleDebug

      - name: Update README and public v0.29 download
        shell: bash
        run: |
          if ! grep -q 'Version 0.29' README.md; then
            cat >> README.md <<'EOF'

          ## Version 0.29 — zones panel visibility hotfix
          - Keeps zone cards fully visible after the v0.28 locked-viewport change.
          - Gives the zones list guaranteed usable space on shorter browser windows.
          - Hides the long help copy automatically when vertical space is tight so it cannot crowd out the zones.
          - On phones, zones use a stable-height horizontal strip instead of being vertically clipped.
          EOF
          fi
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Zone-Sketch-by-Will-v0.29.apk
          python - <<'PY'
          from pathlib import Path
          p=Path('download.html')
          t=p.read_text().replace('v0.28','v0.29').replace('Zone-Sketch-by-Will-v0.28.apk','Zone-Sketch-by-Will-v0.29.apk')
          p.write_text(t)
          PY

      - name: Commit v0.29 source and public APK
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html app/build.gradle README.md download.html downloads/Zone-Sketch-by-Will-v0.29.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Release On Site Zone Planner v0.29 zones panel visibility hotfix'
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.29-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.29-Test-Previews
          path: test-results/
          if-no-files-found: warn
