name: Apply header home logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/header-home-logo.yml'
      - '.github/header_home_logo.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install image and syntax dependencies
        run: |
          python -m pip install --quiet pillow
          npm install --no-save acorn

      - name: Restore approved logo and apply gloss
        run: python .github/header_home_logo.py

      - name: Sync app mirrors and Android asset
        run: |
          cp index.html ZoneSketch.html
          cp index.html Zone-Sketch-by-Will.html
          cp index.html app/src/main/assets/index.html
          mkdir -p app/src/main/assets/assets
          cp assets/zone-sketch-header-mark.png app/src/main/assets/assets/zone-sketch-header-mark.png
          rm -f app/src/main/assets/assets/zone-sketch-header-mark.svg

      - name: Verify exact source artwork and release safety
        run: |
          python .github/verify_247_protected.py
          node tests/release-v062.cjs
          node tests/circuit-editor-syntax-v058.cjs
          test "$(git hash-object assets/on-site-zone-planner-icon.webp)" = "ee3c6bfb43f147543b6f1851a70f7cfca1e42fda"
          grep -q 'id="headerHomeBtn"' index.html
          grep -q 'assets/zone-sketch-header-mark.png' index.html
          grep -q "headerHomeBtn').onclick=()=>projectAction(openProjects)" index.html
          grep -q 'approved original artwork + gloss only' index.html
          grep -q 'filter:none!important' index.html
          grep -q 'zsHeaderHomeShine 9.6s' index.html
          test -s assets/zone-sketch-header-mark.png
          cmp --silent assets/zone-sketch-header-mark.png app/src/main/assets/assets/zone-sketch-header-mark.png
          cmp --silent index.html ZoneSketch.html
          cmp --silent index.html Zone-Sketch-by-Will.html
          cmp --silent index.html app/src/main/assets/index.html

      - name: Commit corrected app files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html assets/zone-sketch-header-mark.png assets/zone-sketch-header-mark.svg app/src/main/assets/assets
          if git diff --cached --quiet; then
            echo 'Approved header logo is already current.'
          else
            git commit -m 'Use original approved logo for header home button'
            git push origin HEAD:main
          fi
