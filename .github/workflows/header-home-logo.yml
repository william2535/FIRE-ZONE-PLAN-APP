name: Apply header home logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/header-home-logo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install transparent home logo
        run: python .github/header_home_logo.py

      - name: Sync app mirrors
        run: |
          cp index.html ZoneSketch.html
          cp index.html Zone-Sketch-by-Will.html
          cp index.html app/src/main/assets/index.html

      - name: Install syntax test dependency
        run: npm install --no-save acorn

      - name: Verify header home logo and release safety
        run: |
          python .github/verify_247_protected.py
          node tests/release-v062.cjs
          node tests/circuit-editor-syntax-v058.cjs
          grep -q 'id="headerHomeBtn"' index.html
          grep -q 'assets/zone-sketch-header-mark.svg' index.html
          grep -q "headerHomeBtn').onclick=()=>projectAction(openProjects)" index.html
          grep -q 'zsHeaderHomeShine 9.6s' index.html
          cmp --silent index.html ZoneSketch.html
          cmp --silent index.html Zone-Sketch-by-Will.html
          cmp --silent index.html app/src/main/assets/index.html

      - name: Commit integrated app files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'Header home logo already integrated.'
          else
            git commit -m 'Make header logo a transparent animated home button'
            git push origin HEAD:main
          fi
