name: Pineapple v0.59 release candidate
on:
  push:
    branches: [project-pineapple-v058]
    paths:
      - '.github/pineapple_v059_release.py'
permissions:
  contents: write
jobs:
  prepare-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-pineapple-v058
          fetch-depth: 0
      - name: Apply deterministic v0.59 release patch
        run: python .github/pineapple_v059_release.py
      - name: Verify protected 24/7 build
        run: python .github/verify_247_protected.py
      - name: Verify v0.59 metadata before browser tests
        run: node tests/release-v059.cjs
      - name: Install browser runtimes
        run: |
          npm install --no-save playwright@1.62.1 acorn@8.15.0
          npx playwright install --with-deps chromium webkit
      - name: Parse and run full serial regression suite
        run: |
          node tests/circuit-editor-syntax-v058.cjs
          node tests/run-regressions.cjs
      - name: Re-run interruption lifecycle in WebKit
        env:
          PINEAPPLE_BROWSER: webkit
        run: node tests/circuit-editor-interruptions-v058.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build v0.59 Android APK
        run: |
          gradle --no-daemon assembleDebug
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Zone-Sketch-by-Will-v0.59.apk
          sha256sum downloads/Zone-Sketch-by-Will-v0.59.apk > downloads/Zone-Sketch-by-Will-v0.59.apk.sha256
      - name: Recheck release metadata and generated parity
        run: |
          node tests/release-v059.cjs
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: Zone-Sketch-by-Will-v0.59-candidate
          path: |
            downloads/Zone-Sketch-by-Will-v0.59.apk
            downloads/Zone-Sketch-by-Will-v0.59.apk.sha256
            test-results/*.png
            test-results/*.pdf
          if-no-files-found: error
      - name: Commit tested v0.59 candidate
        run: |
          git config user.name 'william2535'
          git config user.email '48844093+william2535@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html app/build.gradle beta.html download.html web-v059.html downloads/Zone-Sketch-by-Will-v0.59.apk downloads/Zone-Sketch-by-Will-v0.59.apk.sha256
          if git diff --cached --quiet; then
            echo 'No v0.59 candidate changes to commit.'
            exit 0
          fi
          git commit -m 'Prepare tested Pineapple v0.59 web and Android candidate'
          git push origin HEAD:project-pineapple-v058
