name: Apply Pineapple v0.58 source patch
on:
  push:
    branches: [project-pineapple-v058]
    paths:
      - '.github/pineapple_v058_patch.py'
      - '.github/workflows/pineapple-v058-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-pineapple-v058
          fetch-depth: 0
      - name: Apply deterministic source patch
        run: python .github/pineapple_v058_patch.py
      - name: Verify protected 24/7 build remains unchanged
        run: python .github/verify_247_protected.py
      - name: Commit generated app copies
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'william2535'
          git config user.email '48844093+william2535@users.noreply.github.com'
          git add index.html Zone-Sketch-by-Will.html ZoneSketch.html app/src/main/assets/index.html
          git commit -m 'Fix post-capture rubber-band routing origin'
          git push origin HEAD:project-pineapple-v058
