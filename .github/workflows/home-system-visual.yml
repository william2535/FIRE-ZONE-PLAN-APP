name: Verify approved system artwork
on:
  push:
    branches: [main]
    paths:
      - 'assets/home-system-*.webp'
      - 'app/src/main/assets/assets/home-system-*.webp'
      - '.github/workflows/home-system-visual.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check approved asset bytes and mirrors
        run: |
          printf '%s  %s\n' \
            5a127602de4fd89ad2652c6b7e7ef02ac4eda0b573ab5b0e55068c85ff25d6d7 assets/home-system-fire.webp \
            035dc248cc2d0cc1fdecdac1ea2bf5a47a8e3fe1c1f67fbbb16601d1d2bc2a60 assets/home-system-intruder.webp \
            2a7142bc89e458bc157259049d3f6c565b55514f19f4ab8f16e0a3e0bb37af3c assets/home-system-cctv.webp \
            69d834063f17da0b7faaed01196081cdd85512d8652ec0dccd5874fa6693f258 assets/home-system-access-control.webp | sha256sum -c -
          for file in fire intruder cctv access-control; do cmp "assets/home-system-$file.webp" "app/src/main/assets/assets/home-system-$file.webp"; done
      - name: Browser-check enabled modes
        run: |
          npm install --no-save playwright@1.62.1 acorn@8.15.0
          npx playwright install --with-deps chromium
          node tests/system-modes.cjs
