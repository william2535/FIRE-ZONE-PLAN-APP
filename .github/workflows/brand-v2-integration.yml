name: Build approved Zone Sketch brand v2 assets

on:
  push:
    branches:
      - project-pineapple-brand-v2-integration
    paths:
      - .github/build_brand_v2_assets.py
      - .github/workflows/brand-v2-integration.yml
      - assets/brand/master-v2-approved/approved-board.webp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-brand-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: project-pineapple-brand-v2-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build exact assets from approved board
        run: python .github/build_brand_v2_assets.py

      - name: Verify production outputs
        run: |
          test -f assets/brand/master-v2-approved/production/zone-sketch-primary-1024.webp
          test -f assets/brand/master-v2-approved/production/zone-sketch-fire-1024.png
          test -f assets/brand/master-v2-approved/production/zone-sketch-cctv-1024.png
          test -f assets/brand/master-v2-approved/production/zone-sketch-access-1024.png
          test -f assets/brand/master-v2-approved/production/zone-sketch-mono-1024.png
          test -f assets/brand/master-v2-approved/production/zone-sketch-wordmark-1840.png
          test -f assets/brand/master-v2-approved/production/zone-sketch-splash-1080.webp
          test -f assets/on-site-zone-planner-icon.webp
          test -f app/src/main/res/drawable/app_icon.webp
          test -f app/src/main/res/drawable/app_splash.webp
          python - <<'PY'
          from PIL import Image
          checks = {
              'assets/on-site-zone-planner-icon.webp': (1024, 1024),
              'app/src/main/res/drawable/app_icon.webp': (1024, 1024),
          }
          for path, expected in checks.items():
              with Image.open(path) as im:
                  assert im.size == expected, (path, im.size, expected)
          with Image.open('app/src/main/res/drawable/app_splash.webp') as im:
              assert im.width == 1080 and im.height > im.width, im.size
          print('Brand asset dimensions verified')
          PY

      - name: Commit generated production assets
        run: |
          if git diff --quiet -- assets/brand/master-v2-approved/production assets/on-site-zone-planner-icon.webp app/src/main/res/drawable/app_icon.webp app/src/main/res/drawable/app_splash.webp; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/master-v2-approved/production assets/on-site-zone-planner-icon.webp app/src/main/res/drawable/app_icon.webp app/src/main/res/drawable/app_splash.webp
          git commit -m 'Generate approved Zone Sketch brand v2 production assets'
          git push origin HEAD:project-pineapple-brand-v2-integration
