name: Build approved Zone Sketch brand v2 assets

on:
  push:
    branches:
      - project-pineapple-brand-v2-integration
    paths:
      - .github/brand-v2-source/**
      - .github/build_brand_v2_assets.py
      - .github/workflows/brand-v2-integration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-brand-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: project-pineapple-brand-v2-integration
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build approved primary assets
        run: python .github/build_brand_v2_assets.py

      - name: Verify production outputs
        run: |
          test -f assets/brand/master-v2-approved/production/zone-sketch-primary-source.webp
          test -f assets/brand/master-v2-approved/production/zone-sketch-primary-1024.webp
          test -f assets/brand/master-v2-approved/production/zone-sketch-primary-180.png
          test -f assets/brand/master-v2-approved/production/zone-sketch-primary-192.png
          test -f assets/brand/master-v2-approved/production/zone-sketch-primary-512.png
          test -f assets/on-site-zone-planner-icon.webp
          test -f app/src/main/res/drawable/app_icon.webp
          python - <<'PY'
          from PIL import Image
          for path in [
              'assets/on-site-zone-planner-icon.webp',
              'app/src/main/res/drawable/app_icon.webp',
          ]:
              with Image.open(path) as im:
                  assert im.size == (1024,1024), (path, im.size)
          with Image.open('assets/brand/master-v2-approved/production/zone-sketch-primary-source.webp') as im:
              assert im.size == (312,312), im.size
          print('Approved brand asset dimensions verified')
          PY

      - name: Commit generated production assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/brand/master-v2-approved/production assets/on-site-zone-planner-icon.webp app/src/main/res/drawable/app_icon.webp
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Generate approved Zone Sketch brand v2 primary assets'
          git push origin HEAD:project-pineapple-brand-v2-integration
