name: Pineapple v0.58 routing compatibility
on:
  push:
    branches: [project-pineapple-v058]
permissions:
  contents: read
jobs:
  routing-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run routing compatibility gates
        run: |
          node tests/circuit-routing-state-v057.cjs
          node tests/circuit-aggressive-touch-v057.cjs
          node tests/circuit-routing-hardening-v057.cjs
          node tests/circuit-return-magnet-v056.cjs
          node tests/circuit-capture-transition-v058.cjs
