name: Release On Site Zone Planner v0.36

on:
  push:
    paths:
      - '.github/upgrade_v036.py'
      - '.github/workflows/release-v036.yml'
      - 'tests/mode-separation-v036.cjs'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.36 plan and survey separation
        run: python .github/upgrade_v036.py

      - name: Prepare legacy browser tests for bundled app assets
        run: python .github/prepare_static_test_servers.py

      - name: Verify v0.36 source
        shell: bash
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          grep -q "versionCode 36" app/build.gradle
          grep -q "versionName '0.36'" app/build.gradle
          grep -q 'v0.36 — one building plan, two clean views' index.html
          grep -q 'id="exportSurveyPng"' index.html
          grep -q "scope:surveyMode?'survey':'plan'" index.html
          grep -q "symbolsForMode(state.symbols,surveyMode?'survey':'plan')" index.html
          grep -q "if(!surveyMode&&state.layers.zones!==false)" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/zonesketch-v036.js').write_text('\n'.join(scripts))
          ids=re.findall(r'\bid="([^"]+)"',t)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          print('v0.36 static checks passed')
          PY
          node --check /tmp/zonesketch-v036.js

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run browser regression suite
        run: |
          node tests/mode-separation-v036.cjs
          node tests/favourites.cjs
          node tests/survey-mode.cjs
          node tests/projects.cjs
          node tests/browser.cjs
          node tests/floors.cjs
          node tests/interactions.cjs
          node tests/zone-overlap-v033.cjs
          node tests/zone-fill-v032.cjs
          node tests/zone-sidebar-v031.cjs
          node tests/web-lock-v028.cjs
          node tests/plan-tools-v027.cjs
          node tests/drawing-tools-v026.cjs
          node tests/note-size.cjs
          if [ -f tests/v020.cjs ]; then node tests/v020.cjs; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build v0.36 Android APK
        run: gradle --no-daemon assembleDebug

      - name: Update README and public v0.36 download
        shell: bash
        run: |
          if ! grep -q 'Version 0.36' README.md; then
            cat >> README.md <<'EOF'

          ## Version 0.36 — Zone Plan + Site Survey modes
          - One shared building plan/floor set now has two working views: Zone Plan and Site Survey.
          - Zone Plan shows zones plus Panel, Repeater and You are here symbols.
          - Site Survey hides zone colours and uses surveyed device symbols/counts.
          - Export now produces a separate Zone Plan and Site Survey as PNG or all-floor PDF.
          EOF
          fi
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Zone-Sketch-by-Will-v0.36.apk
          python - <<'PY'
          from pathlib import Path
          p=Path('download.html')
          t=p.read_text().replace('v0.35','v0.36').replace('Zone-Sketch-by-Will-v0.35.apk','Zone-Sketch-by-Will-v0.36.apk')
          p.write_text(t)
          PY

      - name: Commit v0.36 source and public APK
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html app/build.gradle tests/favourites.cjs README.md download.html downloads/Zone-Sketch-by-Will-v0.36.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Release On Site Zone Planner v0.36 plan and survey modes'
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.36-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.36-Test-Previews
          path: test-results/
          if-no-files-found: warn
