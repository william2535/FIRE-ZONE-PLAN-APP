name: Four system modes regression
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'ZoneSketch.html'
      - 'Zone-Sketch-by-Will.html'
      - 'app/src/main/assets/index.html'
      - 'tests/**'
      - '.github/workflows/system-modes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser checks
        run: |
          npm install --no-save playwright@1.62.1 acorn@8.15.0
          npx playwright install --with-deps chromium webkit
      - name: Verify project modes and existing workspace
        run: |
          python .github/verify_247_protected.py
          node tests/release-v063.cjs
          node tests/circuit-editor-syntax-v058.cjs
          node tests/run-regressions.cjs
          BROWSER=webkit node tests/wall-mounted-devices.cjs
          BROWSER=webkit node tests/home-system-filter.cjs
          BROWSER=webkit node tests/cctv-network-builder.cjs
          BROWSER=webkit node tests/survey-menu.cjs
          BROWSER=webkit node tests/camera-direction.cjs
          BROWSER=webkit node tests/startup-logo-split.cjs
          BROWSER=webkit node tests/batch-devices.cjs
          BROWSER=webkit node tests/maps-asfit-stage1.cjs
          BROWSER=webkit node tests/access-maps-stage2.cjs
          BROWSER=webkit node tests/security-maps-stage3.cjs
          cmp index.html ZoneSketch.html
          cmp index.html Zone-Sketch-by-Will.html
          cmp index.html app/src/main/assets/index.html
          git diff --check
