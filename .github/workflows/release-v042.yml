name: Release On Site Zone Planner v0.42
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v042.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.42 interaction fixes
        run: |
          python .github/upgrade_v042.py
          python .github/fix_v042_grid_init.py
      - name: Verify v0.42 source
        shell: bash
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          grep -q "versionCode 43" app/build.gradle
          grep -q "versionName '0.42'" app/build.gradle
          grep -q 'const SURVEY_GRID_STEPS=\[2,5,10,20,40,50,100,150,200,250\]' index.html
          grep -q 'function drawBeamTriangle' index.html
          grep -q 'zoomSliderPointer' index.html
          grep -q "drawing?.mode==='beamSymbol'" index.html
          grep -q "Duplicate created on the grid" index.html
          grep -q 'function wallMergeTolerance()' index.html
          grep -q 'function shutterVisualMetrics(length)' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/zonesketch-v042.js').write_text('\n'.join(scripts))
          ids=re.findall(r'\bid="([^"]+)"',t)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          assert t.index('const SURVEY_GRID_STEPS=') < t.index('const fresh=()=>'), 'Survey grid steps must initialize before startup state'
          print('v0.42 static checks passed')
          PY
          node --check /tmp/zonesketch-v042.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run browser regression suite
        run: |
          node tests/canvas-touch-v042.cjs
          node tests/grid-door-shutter-v041.cjs
          node tests/zoom-beam-duplicate-v042.cjs
          node tests/filled-symbols.cjs
          node tests/survey-edit-zoom.cjs
          node tests/survey-favourites-v040.cjs
          node tests/mode-separation-v036.cjs
          node tests/favourites.cjs
          node tests/survey-mode.cjs
          node tests/projects.cjs
          node tests/browser.cjs
          node tests/floors.cjs
          node tests/interactions.cjs
          if [ -f tests/v020.cjs ]; then node tests/v020.cjs; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build v0.42 Android APK
        run: gradle --no-daemon assembleDebug
      - name: Update public v0.42 download
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Zone-Sketch-by-Will-v0.42.apk
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('download.html')
          t=p.read_text()
          t=re.sub(r'v0\.\d+(?:\.\d+)?', 'v0.42', t)
          t=re.sub(r'downloads/Zone-Sketch-by-Will-v[0-9.]+\.apk', 'downloads/Zone-Sketch-by-Will-v0.42.apk', t)
          p.write_text(t)
          PY
      - name: Commit v0.42 source and public APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html app/build.gradle download.html downloads/Zone-Sketch-by-Will-v0.42.apk
          git commit -m 'Release On Site Zone Planner v0.42 interaction fixes' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.42-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.42-Test-Previews
          path: test-results/*
          if-no-files-found: ignore
# rerun: Survey grid steps initialize before any startup render
# rerun: touch regression waits for Survey mode activation
# rerun: Survey pinch is measured relative to preserved canvas scale
# rerun: grid regression closes popup without stamping a detector
# rerun: v0.40 favourites test accepts finer grid additions
