name: Upgrade Zone Sketch v0.17

on:
  push:
    paths:
      - '.github/upgrade_v017.py'
      - '.github/workflows/upgrade-v017.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.17 upgrade
        run: python .github/upgrade_v017.py

      - name: Check JavaScript, synced copies and fill repair
        shell: bash
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html app/src/main/assets/index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          for m in [
            'function buildFillBoundaryPx',
            'function traceFillFacePx',
            'tiny wall gaps/junctions were joined automatically',
            'splits[best.j].push(best.t)',
            'tries=[0,Math.round(baseTol*.55),baseTol]'
          ]:
            assert m in t, m
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/app.js').write_text('\n'.join(scripts))
          print('v0.17 fill markers and synced copies verified')
          PY
          node --check /tmp/app.js

      - name: Add README v0.17 note
        shell: bash
        run: |
          if ! grep -q 'Version 0.17' README.md; then
            cat >> README.md <<'EOF'

          ## Version 0.17
          - Zone Fill Area now tolerates tiny touch-drawing gaps instead of requiring mathematically perfect wall joins.
          - Fill detection splits unsplit T-junctions during calculation, so resized/moved rooms still fill correctly.
          - Small geometry repairs are temporary for fill detection only; the user's actual building walls are not moved.
          EOF
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android APK
        run: gradle assembleDebug --no-daemon

      - name: Commit upgraded source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html app/src/main/assets/index.html README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Zone Sketch v0.17 robust zone fill detection'
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ZoneSketch-v0.17-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
