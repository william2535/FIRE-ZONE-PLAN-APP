name: Add Zone side-panel action

on:
  push:
    branches: [main]
    paths:
      - '.github/zone_side_create.py'
      - '.github/workflows/zone-side-create.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Add Zone action to side panel
        run: python .github/zone_side_create.py

      - name: Sync app mirrors and Android asset
        run: |
          cp index.html ZoneSketch.html
          cp index.html Zone-Sketch-by-Will.html
          cp index.html app/src/main/assets/index.html

      - name: Install syntax dependency
        run: npm install --no-save acorn

      - name: Verify side-panel Zone action and release safety
        run: |
          python .github/verify_247_protected.py
          node tests/release-v062.cjs
          node tests/circuit-editor-syntax-v058.cjs
          grep -q 'id="sideZoneCreate"' index.html
          grep -q "sideZoneCreate').onclick" index.html
          grep -q 'pendingPhotoPin=null,navMode=true,tapStart=null' index.html
          grep -q 'setMoveMode(!surveyMode)' index.html
          grep -q 'iOS/iPadOS standalone viewport fill' index.html
          grep -q 'App motion parity — tester-hub movement mapped onto the real app shell' index.html
          test "$(git hash-object beta.html)" = "0cda84d2c0907160c63366922330c43586f7b191"
          cmp --silent index.html ZoneSketch.html
          cmp --silent index.html Zone-Sketch-by-Will.html
          cmp --silent index.html app/src/main/assets/index.html

      - name: Commit side-panel Zone action
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'Side-panel Zone action already current.'
          else
            git commit -m 'Add Zone action to side panel'
            git push origin HEAD:main
          fi
