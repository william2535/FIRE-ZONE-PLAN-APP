name: Release On Site Zone Planner v0.33

on:
  push:
    paths:
      - '.github/upgrade_v033.py'
      - '.github/workflows/release-v033.yml'
      - 'tests/zone-overlap-v033.cjs'
      - 'tests/zone-fill-v032.cjs'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.33 constant-opacity zones upgrade
        run: python .github/upgrade_v033.py

      - name: Prepare legacy browser tests for bundled app assets
        run: python .github/prepare_static_test_servers.py

      - name: Verify v0.33 source
        shell: bash
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          grep -q "versionCode 33" app/build.gradle
          grep -q "versionName '0.33'" app/build.gradle
          grep -q 'v0.33 — zone transparency is composited once' index.html
          grep -q 'function drawZoneLayer' index.html
          grep -q 'drawZoneLayer(ctx,zonePaint,state.zones,map,.14)' index.html
          grep -q 'drawZoneLayer(x,d.shapes,d.zones,map,.14)' index.html
          grep -q 'v0.32 — zones are translucent fill only' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/zonesketch-v033.js').write_text('\n'.join(scripts))
          ids=re.findall(r'\bid="([^"]+)"',t)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          assert 'drawZoneLayer(ctx,zonePaint,state.zones,map,.14)' in t
          assert 'drawZoneLayer(x,d.shapes,d.zones,map,.14)' in t
          assert "if(state.layers.zones!==false)for(const sh of state.shapes)" not in t
          assert "for(const sh of d.shapes){const z=d.zones.find" not in t
          print('v0.33 static checks passed')
          PY
          node --check /tmp/zonesketch-v033.js

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run full browser regression suite
        run: |
          node tests/zone-overlap-v033.cjs
          node tests/zone-fill-v032.cjs
          node tests/zone-sidebar-v031.cjs
          node tests/web-lock-v028.cjs
          node tests/plan-tools-v027.cjs
          node tests/drawing-tools-v026.cjs
          node tests/note-size.cjs
          node tests/favourites.cjs
          node tests/survey-mode.cjs
          node tests/projects.cjs
          node tests/browser.cjs
          node tests/floors.cjs
          node tests/interactions.cjs
          if [ -f tests/v020.cjs ]; then node tests/v020.cjs; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build v0.33 Android APK
        run: gradle --no-daemon assembleDebug

      - name: Update README and public v0.33 download
        shell: bash
        run: |
          if ! grep -q 'Version 0.33' README.md; then
            cat >> README.md <<'EOF'

          ## Version 0.33 — constant zone transparency
          - Overlapping zone areas no longer become darker when the same area is covered more than once.
          - Zone fills are composed into one layer first, then the transparency is applied once.
          - The same constant-opacity behaviour is used on the live canvas, Zone Box/Outline previews and exported plans.
          - Different overlapping zone colours can still replace one another visually, but the transparency never stacks darker.
          EOF
          fi
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Zone-Sketch-by-Will-v0.33.apk
          python - <<'PY'
          from pathlib import Path
          p=Path('download.html')
          t=p.read_text().replace('v0.32','v0.33').replace('Zone-Sketch-by-Will-v0.32.apk','Zone-Sketch-by-Will-v0.33.apk')
          p.write_text(t)
          PY

      - name: Commit v0.33 source and public APK
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html app/build.gradle README.md download.html downloads/Zone-Sketch-by-Will-v0.33.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Release On Site Zone Planner v0.33 constant zone opacity'
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.33-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.33-Test-Previews
          path: test-results/
          if-no-files-found: warn
