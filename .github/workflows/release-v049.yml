name: Release On Site Zone Planner v0.49
# Retry after preserving legacy UI contracts and fixing project-home load ordering.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v049.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.49 site-ready professional polish
        run: python .github/upgrade_v049_site_ready.py
      - name: Apply v0.49 regression compatibility fixes
        run: python .github/fix_v049_regressions.py
      - name: Verify v0.49 source
        shell: bash
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          grep -q "versionCode 50" app/build.gradle
          grep -q "versionName '0.49'" app/build.gradle
          grep -q 'homeProductHero' index.html
          grep -q 'appSettingsModal' index.html
          grep -q 'uiToastStack' index.html
          grep -q 'cbAsFitSummary' index.html
          grep -q 'cbLandingHero' index.html
          grep -q 'CABLES PAIRED' index.html
          grep -q 'TWIN CABLE SNAP' index.html
          grep -q 'Make a new plan' index.html
          grep -q 'v0.49' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/zonesketch-v049.js').write_text('\n'.join(scripts))
          assert "if(d<=25)hits.push" in t
          assert "if(d<=34&&" in t
          assert "uiHaptics" in t
          assert "uiReducedMotion" in t
          assert "await renderProjects();$('homeNew').disabled=false" in t
          assert "Smoke" in t and "Detection" in t and "Alarm" in t and "Control" in t
          print('v0.49 static checks passed')
          PY
          node --check /tmp/zonesketch-v049.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run full regression and site-ready suites
        run: |
          node tests/run-regressions.cjs
          node tests/site-ready-v049.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build v0.49 Android APK
        run: gradle --no-daemon assembleDebug
      - name: Update public v0.49 download
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Zone-Sketch-by-Will-v0.49.apk
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('download.html')
          t=p.read_text()
          t=re.sub(r'v0\.\d+(?:\.\d+)?', 'v0.49', t)
          t=re.sub(r'downloads/Zone-Sketch-by-Will-v[0-9.]+\.apk', 'downloads/Zone-Sketch-by-Will-v0.49.apk', t)
          p.write_text(t)
          PY
      - name: Commit v0.49 source and public APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html app/build.gradle download.html downloads/Zone-Sketch-by-Will-v0.49.apk
          git commit -m 'Release Zone Sketch v0.49 site-ready professional polish' || exit 0
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/zone-sketch-v049.apk
          git stash push --include-untracked -m 'v0.49 runner build state' || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          mkdir -p app/build/outputs/apk/debug
          cp /tmp/zone-sketch-v049.apk app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Zone-Sketch-v0.49-Site-Ready-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
