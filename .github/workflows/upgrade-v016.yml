name: Upgrade Zone Sketch v0.16

on:
  push:
    paths:
      - '.github/upgrade_v016.py'
      - '.github/workflows/upgrade-v016.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.16 upgrade
        run: python .github/upgrade_v016.py

      - name: Check JavaScript, synced copies and collapsible chrome
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=[Path('index.html'),Path('ZoneSketch.html'),Path('app/src/main/assets/index.html')]
          text=[p.read_text(encoding='utf-8') for p in files]
          assert text[0]==text[1]==text[2], 'HTML copies differ'
          s=text[0]
          for marker in ['id="topCollapseBtn"','id="topMain"','id="topEssential"','id="closeZones"','topClosed','zonesClosed']:
              assert marker in s, f'missing {marker}'
          assert "b.textContent=topSectionOpen?'▲':'▼'" in s
          assert "b.textContent=zonesPanelOpen?'‹':'›'" in s
          assert "if(navMode)setMoveMode(false);setTool" in s
          ids=re.findall(r'id="([^"]+)"',s)
          dup=sorted({i for i in ids if ids.count(i)>1})
          assert not dup, f'duplicate ids: {dup}'
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          assert m, 'script block missing'
          Path('/tmp/zonesketch.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/zonesketch.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Commit upgraded source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html app/src/main/assets/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Upgrade Zone Sketch to v0.16 collapsible chrome'
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ZoneSketch-v0.16-APK
          path: app/build/outputs/apk/debug/app-debug.apk
