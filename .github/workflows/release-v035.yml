name: Release On Site Zone Planner v0.35

on:
  push:
    paths:
      - '.github/upgrade_v035.py'
      - '.github/workflows/release-v035.yml'
      - 'tests/symbol-size-v035.cjs'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.35 extra-small symbol upgrade
        run: python .github/upgrade_v035.py

      - name: Prepare legacy browser tests for bundled app assets
        run: python .github/prepare_static_test_servers.py

      - name: Verify v0.35 source
        shell: bash
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          grep -q "versionCode 35" app/build.gradle
          grep -q "versionName '0.35'" app/build.gradle
          grep -q 'v0.35 — extra-small symbols' index.html
          grep -q 'id="symbolStampScale" type="range" min="0.10"' index.html
          grep -q 'Math.max(2,size)' index.html
          grep -q 'Math.max(2.5,r\*.55)' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/zonesketch-v035.js').write_text('\n'.join(scripts))
          ids=re.findall(r'\bid="([^"]+)"',t)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          assert 'min="0.10" max="4" step="0.05"' in t
          assert "v>=.10&&v<=4" in t
          assert "Math.max(.10,Math.min(4,v))" in t
          print('v0.35 static checks passed')
          PY
          node --check /tmp/zonesketch-v035.js

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run full browser regression suite
        run: |
          node tests/symbol-size-v035.cjs
          node tests/symbol-size-v034.cjs
          node tests/zone-overlap-v033.cjs
          node tests/zone-fill-v032.cjs
          node tests/zone-sidebar-v031.cjs
          node tests/web-lock-v028.cjs
          node tests/plan-tools-v027.cjs
          node tests/drawing-tools-v026.cjs
          node tests/note-size.cjs
          node tests/favourites.cjs
          node tests/survey-mode.cjs
          node tests/projects.cjs
          node tests/browser.cjs
          node tests/floors.cjs
          node tests/interactions.cjs
          if [ -f tests/v020.cjs ]; then node tests/v020.cjs; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build v0.35 Android APK
        run: gradle --no-daemon assembleDebug

      - name: Update README and public v0.35 download
        shell: bash
        run: |
          if ! grep -q 'Version 0.35' README.md; then
            cat >> README.md <<'EOF'

          ## Version 0.35 — extra-small symbols
          - New symbol size can now go down to 0.10× instead of 0.25×.
          - The symbol renderer itself now has a much smaller minimum radius, line width and label size, so the lower end of the slider genuinely looks smaller on the plan.
          - Existing placed symbols are unchanged and can still be resized individually from Properties.
          EOF
          fi
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Zone-Sketch-by-Will-v0.35.apk
          python - <<'PY'
          from pathlib import Path
          p=Path('download.html')
          t=p.read_text().replace('v0.34','v0.35').replace('Zone-Sketch-by-Will-v0.34.apk','Zone-Sketch-by-Will-v0.35.apk')
          p.write_text(t)
          PY

      - name: Commit v0.35 source and public APK
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html app/build.gradle README.md download.html downloads/Zone-Sketch-by-Will-v0.35.apk
          if ! git diff --cached --quiet; then
            git commit -m 'Release On Site Zone Planner v0.35 extra-small symbols'
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.35-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.35-Test-Previews
          path: test-results/
          if-no-files-found: warn
