name: Upgrade Zone Sketch v0.20 Public Tester Release

on:
  push:
    paths:
      - '.github/upgrade_v020.py'
      - '.github/workflows/upgrade-v020.yml'
      - 'tests/v020.cjs'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.20 public tester upgrade
        run: python .github/upgrade_v020.py

      - name: Check synced copies, version and JavaScript
        shell: bash
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html app/src/main/assets/index.html
          grep -q "versionCode 20" app/build.gradle
          grep -q "versionName '0.20'" app/build.gradle
          grep -q 'data-menu-tool="doubleDoor"' index.html
          grep -q 'data-menu-tool="layoutEllipse"' index.html
          grep -q 'function drawDoubleDoor' index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/zonesketch-v020.js').write_text('\n'.join(scripts))
          ids=re.findall(r'\bid="([^"]+)"',t)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          for marker in [
              "objectTools=new Set(['door','doubleDoor','window','shutter','stairs'])",
              "layoutEllipse:'Circular room'",
              "obj.double=kind==='doubleDoor'",
              "door.double?drawDoubleDoor",
              "steps=32,gid=uid()",
          ]:
              assert marker in t, marker
          print('v0.20 static release checks passed')
          PY
          node --check /tmp/zonesketch-v020.js

      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run complete browser regression suite
        run: |
          node tests/browser.cjs
          node tests/floors.cjs
          node tests/interactions.cjs
          node tests/v020.cjs

      - name: Add v0.20 release notes
        shell: bash
        run: |
          if ! grep -q 'Version 0.20' README.md; then
            cat >> README.md <<'EOF'

          ## Version 0.20 — public tester build
          - Adds Double door as a proper wall-opening object with two swing leaves and finger-side swing preview.
          - Adds Circular room under Building layout; drag a circle/oval to create editable wall sections that accept doors/windows and Zone Fill Area.
          - Double doors remain selectable, deletable, movable, groupable, undoable and included correctly in office exports.
          - Browser, standalone HTML and Android WebView copies are kept identical.
          - Android app version bumped to 0.20 for the public tester release.
          - Release workflow runs the full browser regression suite plus dedicated v0.20 geometry/mobile tests before building the APK.
          EOF
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android APK
        run: gradle --no-daemon assembleDebug

      - name: Commit public tester source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html app/src/main/assets/index.html app/build.gradle README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Release Zone Sketch v0.20 public tester build'
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ZoneSketch-v0.20-Browser-Tests
          path: test-results/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: ZoneSketch-v0.20-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
