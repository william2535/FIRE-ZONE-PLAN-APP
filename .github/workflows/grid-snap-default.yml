name: Grid snap default

on:
  push:
    branches:
      - project-pineapple-grid-snap-default
    paths:
      - '.github/workflows/grid-snap-default.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-pineapple-grid-snap-default

      - name: Apply grid snap default
        run: python .github/grid-snap-default.py

      - name: Sync app mirrors
        run: |
          cp index.html ZoneSketch.html
          cp index.html Zone-Sketch-by-Will.html
          cp index.html app/src/main/assets/index.html

      - name: Install syntax dependency
        run: npm install --no-save acorn

      - name: Verify grid snap default and release safety
        run: |
          python .github/verify_247_protected.py
          node tests/release-v062.cjs
          node tests/circuit-editor-syntax-v058.cjs
          grep -q 'gridVisible:true,snapGrid:true,gridSize:100' index.html
          cmp --silent index.html ZoneSketch.html
          cmp --silent index.html Zone-Sketch-by-Will.html
          cmp --silent index.html app/src/main/assets/index.html
          git diff --exit-code HEAD -- beta.html download.html

      - name: Commit tested grid snap default
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'Grid snap default already integrated.'
          else
            git commit -m 'Start Zone Plan with grid snap on'
            git push origin HEAD:project-pineapple-grid-snap-default
          fi
