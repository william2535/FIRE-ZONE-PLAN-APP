name: Upgrade Zone Sketch v0.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/upgrade-v07.yml'
      - '.github/upgrade_v07.py'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply v0.7 upgrade
        run: python .github/upgrade_v07.py

      - name: Check JavaScript syntax and synced copies
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path('index.html'), Path('ZoneSketch.html'), Path('app/src/main/assets/index.html')]
          texts = [p.read_text() for p in files]
          assert texts[0] == texts[1] == texts[2], 'App copies are not identical'
          s = texts[0]
          for marker in ['function mergeOverlappingWalls()','globalAlpha=.07','const raw=Math.max(img.width,img.height)/32','fs=Math.min(img.width,img.height)*.022*v.s']:
              assert marker in s, marker
          assert "'Z'+num" not in s.split('function shape(',1)[1].split('function badge(',1)[0], 'Zone badge still present in shape()'
          js = s.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/zone-sketch-v07.js').write_text(js)
          PY
          node --check /tmp/zone-sketch-v07.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Android APK
        run: gradle --no-daemon assembleDebug

      - name: Commit upgraded source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html app/src/main/assets/index.html README.md
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Upgrade Zone Sketch to v0.7 drawing polish'
            git push
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ZoneSketch-v0.7-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
