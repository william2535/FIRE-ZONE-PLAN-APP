name: Build Zone Sketch by Will Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
      - 'download.html'
      - 'beta.html'
      - 'README.md'
      - '.github/workflows/**'
      - '.github/sync-beta-portal.py'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check Zone Sketch by Will drawing and export in browser
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
          node tests/run-regressions.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zone-Sketch-by-Will-Browser-Previews
          path: |
            test-results/*.png
            test-results/*.pdf
      - name: Build installable Zone Sketch by Will APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Zone-Sketch-by-Will-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
