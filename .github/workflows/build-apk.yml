name: Build Zone Sketch by Will Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'downloads/**'
      - 'download.html'
      - 'beta.html'
      - 'README.md'
      - '.github/workflows/**'
      - '.github/sync-beta-portal.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify locked 24/7 Protection build
        run: python .github/verify_247_protected.py
      - name: Check current release metadata and source parity
        run: |
          node tests/release-v063.cjs
          node tests/circuit-editor-syntax-v058.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Check Zone Sketch by Will drawing and export in browser
        run: |
          npm install --no-save playwright@1.62.1 acorn
          npx playwright install --with-deps chromium
          node tests/run-regressions.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Zone-Sketch-by-Will-Browser-Previews
          path: |
            test-results/*.png
            test-results/*.pdf
      - name: Build installable Zone Sketch by Will APK
        run: gradle --no-daemon assembleDebug
      - name: Publish tested v0.63 Android package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Zone-Sketch-by-Will-v0.63.apk
          sha256sum downloads/Zone-Sketch-by-Will-v0.63.apk > downloads/Zone-Sketch-by-Will-v0.63.apk.sha256
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/Zone-Sketch-by-Will-v0.63.apk downloads/Zone-Sketch-by-Will-v0.63.apk.sha256
          git commit -m 'Publish Zone Sketch v0.63 Android package'
          git push origin HEAD:main
          if gh release view v0.63 >/dev/null 2>&1; then
            gh release upload v0.63 downloads/Zone-Sketch-by-Will-v0.63.apk --clobber
          else
            gh release create v0.63 downloads/Zone-Sketch-by-Will-v0.63.apk \
              --target "$(git rev-parse HEAD)" \
              --title 'Zone Sketch by Will v0.63' \
              --notes 'Four saved system types: Fire, Security, CCTV and Access Control. All use the shared field workspace. Existing projects open as Fire.'
      - uses: actions/upload-artifact@v4
        with:
          name: Zone-Sketch-by-Will-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
