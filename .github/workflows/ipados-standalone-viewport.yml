name: Apply iPad standalone viewport fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ipados-standalone-viewport.yml'
      - '.github/ipados_standalone_viewport.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install iPadOS standalone viewport fill
        run: python .github/ipados_standalone_viewport.py

      - name: Sync app mirrors and Android asset
        run: |
          cp index.html ZoneSketch.html
          cp index.html Zone-Sketch-by-Will.html
          cp index.html app/src/main/assets/index.html

      - name: Install syntax dependency
        run: npm install --no-save acorn

      - name: Verify standalone fix and existing release safety
        run: |
          python .github/verify_247_protected.py
          node tests/release-v062.cjs
          node tests/circuit-editor-syntax-v058.cjs
          grep -q 'viewport-fit=cover' index.html
          grep -q 'iPadOS standalone viewport fill' index.html
          grep -q '@media (display-mode:standalone)' index.html
          grep -q 'min-height:-webkit-fill-available' index.html
          grep -q '"display": "standalone"' manifest.webmanifest
          test "$(git hash-object beta.html)" = "0cda84d2c0907160c63366922330c43586f7b191"
          cmp --silent index.html ZoneSketch.html
          cmp --silent index.html Zone-Sketch-by-Will.html
          cmp --silent index.html app/src/main/assets/index.html

      - name: Commit corrected standalone viewport
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'iPadOS standalone viewport fix already current.'
          else
            git commit -m 'Fix iPad standalone bottom viewport strip'
            git push origin HEAD:main
          fi
