name: Release On Site Zone Planner v0.43
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v043.yml'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v0.43 Circuit Builder
        run: |
          python .github/upgrade_v043.py
          python .github/fix_v043_mobile.py
      - name: Verify v0.43 source
        shell: bash
        run: |
          cmp -s index.html ZoneSketch.html
          cmp -s index.html Zone-Sketch-by-Will.html
          cmp -s index.html app/src/main/assets/index.html
          grep -q "versionCode 44" app/build.gradle
          grep -q "versionName '0.43'" app/build.gradle
          grep -q 'id="circuitModeBtn"' index.html
          grep -q 'id="circuitBuilder"' index.html
          grep -q 'function cbNewCircuit' index.html
          grep -q 'function cbFinishAsFit' index.html
          grep -q 'function cbDrawBundled' index.html
          grep -q "'circuits','asFit'" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text()
          scripts=re.findall(r'<script(?![^>]*src=)[^>]*>(.*?)</script>',t,re.S)
          Path('/tmp/zonesketch-v043.js').write_text('\n'.join(scripts))
          ids=re.findall(r'\bid="([^"]+)"',t)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'duplicate ids: {dup}'
          for token in ['cbFinishAsFitMain','cbExistingMain','CB_ROUTE_GRID','cbPlanPathForLeg']:
              assert token in t, token
          print('v0.43 static checks passed')
          PY
          node --check /tmp/zonesketch-v043.js
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run Circuit Builder and regression suites
        run: |
          node tests/circuit-builder-v043.cjs
          node tests/canvas-touch-v042.cjs
          node tests/grid-door-shutter-v041.cjs
          node tests/zoom-beam-duplicate-v042.cjs
          node tests/filled-symbols.cjs
          node tests/survey-edit-zoom.cjs
          node tests/survey-favourites-v040.cjs
          node tests/mode-separation-v036.cjs
          node tests/favourites.cjs
          node tests/survey-mode.cjs
          node tests/projects.cjs
          node tests/browser.cjs
          node tests/floors.cjs
          node tests/interactions.cjs
          if [ -f tests/v020.cjs ]; then node tests/v020.cjs; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDK_MANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build v0.43 Android APK
        run: gradle --no-daemon assembleDebug
      - name: Update public v0.43 download
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Zone-Sketch-by-Will-v0.43.apk
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('download.html')
          t=p.read_text()
          t=re.sub(r'v0\.\d+(?:\.\d+)?', 'v0.43', t)
          t=re.sub(r'downloads/Zone-Sketch-by-Will-v[0-9.]+\.apk', 'downloads/Zone-Sketch-by-Will-v0.43.apk', t)
          p.write_text(t)
          PY
      - name: Commit v0.43 source and public APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html app/build.gradle download.html downloads/Zone-Sketch-by-Will-v0.43.apk
          git commit -m 'Release On Site Zone Planner v0.43 Circuit Builder foundation' || exit 0
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/zone-sketch-v043.apk
          if [ -d test-results ]; then cp -a test-results /tmp/zone-sketch-v043-test-results; fi
          git stash push --include-untracked -m 'v0.43 runner build state' || true
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          mkdir -p app/build/outputs/apk/debug
          cp /tmp/zone-sketch-v043.apk app/build/outputs/apk/debug/app-debug.apk
          if [ -d /tmp/zone-sketch-v043-test-results ]; then rm -rf test-results; cp -a /tmp/zone-sketch-v043-test-results test-results; fi
      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.43-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: On-Site-Zone-Planner-v0.43-Test-Previews
          path: test-results/*
          if-no-files-found: ignore
