name: Empty favourites default

on:
  push:
    branches:
      - project-pineapple-empty-favourites-default
    paths:
      - '.github/workflows/empty-favourites-default.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project-pineapple-empty-favourites-default

      - name: Apply empty favourites default
        run: python .github/empty-favourites-default.py

      - name: Sync app mirrors
        run: |
          cp index.html ZoneSketch.html
          cp index.html Zone-Sketch-by-Will.html
          cp index.html app/src/main/assets/index.html

      - name: Install syntax dependency
        run: npm install --no-save acorn

      - name: Verify favourites default and release safety
        run: |
          python .github/verify_247_protected.py
          node tests/release-v062.cjs
          node tests/circuit-editor-syntax-v058.cjs
          grep -q "const defaultFavourites=\[\],previousDefaultFavourites=" index.html
          grep -q "return valid.slice(0,10)}}catch(e){}return\[\]" index.html
          cmp --silent index.html ZoneSketch.html
          cmp --silent index.html Zone-Sketch-by-Will.html
          cmp --silent index.html app/src/main/assets/index.html
          git diff --exit-code HEAD -- beta.html download.html

      - name: Commit tested favourites default
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ZoneSketch.html Zone-Sketch-by-Will.html app/src/main/assets/index.html
          if git diff --cached --quiet; then
            echo 'Empty favourites default already integrated.'
          else
            git commit -m 'Start Zone Plan with no favourites selected'
            git push origin HEAD:project-pineapple-empty-favourites-default
          fi
